<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4CAAAA">
<title>Accedi · Calendario eventi · To Smile</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To Smile Eventi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#EFF5F5;--dot:#D3E2E2;--surface:#fff;--surface-2:#F5F9F9;--fg:#1F2A2B;--muted:#5E6B6C;--line:#DCE7E7;--accent:#2B8384;--accent-fg:#fff;--danger:#B42318;--danger-soft:#FBE3E0;--brand-teal:#4CAAAA;--brand-purple:#8C6898;--brand-yellow:#E8E564;--brand-gray:#656565}
@media (prefers-color-scheme: dark){:root{--bg:#101818;--dot:#1E2B2B;--surface:#172121;--surface-2:#1D2929;--fg:#E7F0F0;--muted:#9FB0B0;--line:#2A3939;--accent:#62C3C3;--accent-fg:#062222;--danger:#FF8A7A;--danger-soft:#3A1D1A;--brand-teal:#62C3C3;--brand-purple:#B597C2;--brand-gray:#B9C2C2;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--fg);font:16px/1.5 "Fira Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:min(400px,100%);border-top:4px solid var(--brand-yellow);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(20,48,48,.12)}
.logo{display:block;width:220px;height:auto;margin:2px 0 20px}
h1{font:700 24px/1.2 "Fira Sans",sans-serif;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted);font-size:15px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:14px}
input{font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;font:inherit;font-weight:700;border:none;border-radius:11px;padding:12px;background:var(--accent);color:var(--accent-fg);cursor:pointer;margin-top:4px}
button:disabled{opacity:.6}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:14px}
.foot{margin:18px 0 0;font-size:13px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/logo.png" alt="To Smile — persone, salute, sorrisi" width="543" height="162">
  <h1>Calendario eventi</h1>
  <p>Formazione, riunioni ed eventi aziendali. Entra con il nome utente e la password che ti ha dato l'amministrazione.</p>
  <div class="err" id="err" hidden></div>
  <form id="f">
    <label>Nome utente<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button id="b" type="submit">Entra</button>
  </form>
  <p class="foot">Password dimenticata? Chiedi all'amministrazione.</p>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; b.textContent = 'Accesso…'; err.hidden = true;
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Accesso non riuscito. Riprova.');
    location.href = '/';
  } catch (x) {
    err.textContent = x.message; err.hidden = false; b.disabled = false; b.textContent = 'Entra';
  }
});
</script>
</body>
</html>
